name: Secret & Credential Scanning

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secrets & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
